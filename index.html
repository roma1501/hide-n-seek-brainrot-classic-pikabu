<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Прятки в лабиринте</title>
    <link rel="icon" type="image/png" href="assets/branding/lory-engine.png">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #222;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        input, textarea, [contenteditable] { -webkit-user-select: text; user-select: text; }
        img { -webkit-user-drag: none; }
        #world3d {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
            touch-action: none;
        }
        @font-face { font-family: 'HsRubik'; src: url('assets/fonts/rubik.ttf?v=0.1.2-481bd355') format('truetype'); font-weight: 300 900; font-display: swap; }
        /* Экран загрузки: navy-фон с лучами, логотип-название, голубая шкала */
        #loading-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: clamp(8px, 2.2vh, 18px);
            padding: 16px;
            box-sizing: border-box;
            overflow: hidden;
            background: radial-gradient(ellipse at 50% 42%, #1f5ee6 0, #0f378f 42%, #061344 100%);
            font-family: 'HsRubik', 'Rubik', system-ui, sans-serif;
            z-index: 1000;
        }
        #loading-screen::before {
            content: '';
            position: absolute;
            left: 50%; top: 42%;
            width: 170%; aspect-ratio: 1;
            margin: -85% 0 0 -85%;
            background: repeating-conic-gradient(from 0deg, rgba(120, 200, 255, .22) 0 9deg, transparent 9deg 24deg);
            -webkit-mask: radial-gradient(circle, #000 0, transparent 52%);
            mask: radial-gradient(circle, #000 0, transparent 52%);
            animation: ld-spin 40s linear infinite;
            pointer-events: none;
        }
        #loading-screen > * { position: relative; }
        .ld-coin { width: clamp(52px, 13vh, 96px); height: clamp(52px, 13vh, 96px); object-fit: contain; animation: ld-coin 1.3s ease-in-out infinite; filter: drop-shadow(0 6px 0 rgba(3, 10, 50, .55)); }
        #loading-title {
            margin: 0;
            max-width: min(92%, 760px);
            text-align: center;
            font-weight: 900;
            font-size: clamp(30px, min(9vh, 11vmin), 72px);
            line-height: .98;
            letter-spacing: .01em;
            text-transform: uppercase;
            transform: rotate(-3deg);
            background: linear-gradient(180deg, #fff8b0 0, #ffd23d 48%, #ff9a1c 100%);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent; color: transparent;
            filter: drop-shadow(3px 0 0 #0a1a52) drop-shadow(-3px 0 0 #0a1a52) drop-shadow(0 3px 0 #0a1a52) drop-shadow(0 -3px 0 #0a1a52) drop-shadow(0 7px 0 #07123b) drop-shadow(0 12px 8px rgba(0, 0, 0, .4));
            padding: 4px 8px;
        }
        .loading-bar {
            width: min(340px, 78%);
            height: clamp(16px, 3.4vh, 24px);
            padding: 3px;
            box-sizing: border-box;
            border-radius: 99px;
            background: #030c30;
            border: 3px solid #4aa8ff;
            box-shadow: 0 4px 0 #04123d, 0 0 18px rgba(60, 160, 255, .55), inset 0 3px 6px rgba(0, 0, 0, .7);
            overflow: hidden;
        }
        .loading-progress {
            position: relative;
            height: 100%;
            width: 0%;
            min-width: 14px;
            border-radius: 99px;
            background: linear-gradient(180deg, #b4f0ff 0, #3fc4ff 45%, #1788f0 100%);
            box-shadow: inset 0 2px 0 rgba(255, 255, 255, .6);
            transition: width .3s ease;
            overflow: hidden;
        }
        .loading-progress::after {
            content: '';
            position: absolute; top: 0; bottom: 0; width: 40%; left: 0;
            background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .7), transparent);
            animation: ld-shine 1.4s linear infinite;
        }
        #loading-percent { font-weight: 900; font-size: 22px; color: #fff; text-shadow: 0 2px 0 #0a1a52, 2px 0 0 #0a1a52, -2px 0 0 #0a1a52, 0 -2px 0 #0a1a52; font-variant-numeric: tabular-nums; }
        .loading-text { font-weight: 800; font-size: 15px; color: #a9d4ff; text-align: center; min-height: 1.2em; text-shadow: 0 2px 0 rgba(4, 18, 70, .8); }
        #loading-retry {
            padding: 12px 28px; border: 3px solid #0a4d19; border-radius: 16px;
            background: linear-gradient(180deg, #7cff6b, #1fc03a 55%, #17a02c);
            box-shadow: 0 6px 0 #0e6e22, 0 9px 0 #0a4d19, inset 0 3px 0 rgba(255, 255, 255, .55);
            color: #fff; font: 900 20px 'HsRubik', 'Rubik', system-ui, sans-serif; text-transform: uppercase;
            text-shadow: 0 2px 0 #0a4d19; cursor: pointer;
        }
        #loading-retry:active { transform: translateY(6px); box-shadow: 0 0 0 #0e6e22, 0 3px 0 #0a4d19; }
        @keyframes ld-spin { to { transform: rotate(360deg); } }
        @keyframes ld-shine { from { transform: translateX(-120%); } to { transform: translateX(380%); } }
        @keyframes ld-coin { 0%, 100% { transform: rotateY(0) translateY(0); } 50% { transform: rotateY(180deg) translateY(-10px); } }
        @media (prefers-reduced-motion: reduce) { #loading-screen::before, .ld-coin, .loading-progress::after { animation: none; } }
    </style>
</head>
<body>

    <script>
        // Игровая область: долгий тап и ПКМ не открывают меню браузера, картинки не
        // тянутся, текст не выделяется — кроме настоящих полей ввода.
        (() => {
            const isField = t => t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable);
            for (const type of ['contextmenu', 'dragstart', 'selectstart']) {
                document.addEventListener(type, e => { if (!isField(e.target)) e.preventDefault(); });
            }
        })();
    </script>
